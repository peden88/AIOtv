name: AIOtv Feature Preview Build

on:
  push:
    branches: [feature/next-episode-prefetch]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiotv-feature-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-preview-build:
    name: Build side-by-side feature preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare stable preview signing config
        run: |
          base64 --decode .github/test-signing/aiotv-test.jks.b64 > "$RUNNER_TEMP/aiotv-test.jks"

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/aiotv-test.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=aiotvtest"
            echo "NUVIO_RELEASE_KEY_PASSWORD=aiotvtest"
            echo "NUVIO_RELEASE_STORE_PASSWORD=aiotvtest"
          } >> "$GITHUB_ENV"

      - name: Apply AIOtv product and UI layers
        run: |
          python3 scripts/apply-aiotv-polish.py
          python3 scripts/apply-aiotv-ui-refresh.py
          python3 scripts/apply-aiotv-shell.py
          python3 scripts/apply-aiotv-surfaces.py
          python3 scripts/apply-aiotv-player.py

      - name: Test prefetch and build preview APK
        env:
          AIOTV_CONTROL_URL: ${{ vars.AIOTV_CONTROL_URL }}
        run: |
          ./gradlew \
            :app:testFullPreviewUnitTest \
            --tests 'com.nuvio.tv.updater.*' \
            --tests 'com.nuvio.tv.data.repository.StreamSearchSessionCacheTest' \
            --tests 'com.nuvio.tv.ui.screens.player.NextEpisodeStreamPrefetchPolicyTest' \
            :app:assembleFullPreview \
            --stacktrace

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiotv-feature-preview-${{ github.run_number }}
          path: app/build/outputs/apk/full/preview/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish feature preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          SOURCE_APK="$(find app/build/outputs/apk/full/preview -maxdepth 1 -type f -name '*universal*.apk' -print -quit)"
          RELEASE_APK='AIOtv-feature-preview.apk'
          TAG='aiotv-feature-preview'

          test -n "$SOURCE_APK"
          cp "$SOURCE_APK" "$RELEASE_APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" \
              "$RELEASE_APK" \
              --target "$HEAD_SHA" \
              --title 'AIOtv Feature Preview' \
              --notes 'Side-by-side preview of work that has not yet been merged into the current managed AIOtv build.' \
              --prerelease
          fi
