name: Build NuvioTV Prefetch 4K APK

on:
  push:
    branches: [build/nuvio-prefetch-4k]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuviotv-prefetch-4k-builder
  cancel-in-progress: true

jobs:
  build:
    name: Build new-fork arm64 test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out NuvioTV test source
        uses: actions/checkout@v4
        with:
          repository: peden88/NuvioTV
          ref: feature/prefetch-4k-test
          fetch-depth: 1
          persist-credentials: false

      - name: Record source revision
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure public Nuvio backend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          request = urllib.request.Request(
              "https://api.nuvio.tv/.well-known/nuvio",
              headers={"User-Agent": "NuvioTV-Prefetch-4K-CI/1.0"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              config = json.load(response)

          backend = (config.get("backend_url") or "https://api.nuvio.tv").strip().rstrip("/")
          key = (config.get("publishable_key") or "").strip()
          if not key:
              raise SystemExit("Nuvio discovery did not return publishable_key")

          properties = "\n".join([
              f"NUVIO_SUPABASE_URL={backend}",
              f"NUVIO_SUPABASE_ANON_KEY={key}",
              "NUVIO_SUPABASE_FALLBACK_URL=",
              "TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login",
              "INTRODB_API_URL=https://api.introdb.app/",
              "",
          ])
          pathlib.Path("local.properties").write_text(properties)
          pathlib.Path("local.dev.properties").write_text(properties)
          print(f"Configured public backend: {backend}")
          PY

      - name: Install dedicated test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode .github/test-signing/nuvio-prefetch-4k-debug.jks.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey             >/dev/null

      - name: Run targeted prefetch tests
        run: |
          ./gradlew             :app:testFullDebugUnitTest             --tests 'com.nuvio.tv.ui.screens.player.NextEpisodeStreamPrefetchPolicyTest'             --no-daemon             --stacktrace

      - name: Build arm64-only APK
        run: ./gradlew :app:assembleFullDebug --no-daemon --stacktrace

      - name: Verify package, ABI and signature
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK='app/build/outputs/apk/full/debug/app-full-arm64-v8a-debug.apk'
          OUTPUT_APK='Nuvio-Prefetch-4K-arm64-v8a.apk'
          test -f "$SOURCE_APK"
          cp "$SOURCE_APK" "$OUTPUT_APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$OUTPUT_APK" | tee apk-badging.txt
          grep -q "package: name='com.nuvio.tv.prefetch4k'" apk-badging.txt
          grep -q "native-code: 'arm64-v8a'" apk-badging.txt
          if grep -q "armeabi-v7a" apk-badging.txt; then
            echo "Unexpected 32-bit ABI present" >&2
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK" | tee apk-signature.txt
          sha256sum "$OUTPUT_APK" | tee APK-SHA256.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-prefetch-4k-${{ github.run_number }}
          path: |
            Nuvio-Prefetch-4K-arm64-v8a.apk
            APK-SHA256.txt
            apk-signature.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling test prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          TAG='nuvio-prefetch-4k-test'
          NOTES="Built from peden88/NuvioTV feature/prefetch-4k-test at ${SOURCE_SHA}. Test-only arm64-v8a APK for Google TV Streamer 4K. Package com.nuvio.tv.prefetch4k; dedicated signing identity; designed to install alongside normal Nuvio."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               Nuvio-Prefetch-4K-arm64-v8a.apk               APK-SHA256.txt               apk-signature.txt               apk-badging.txt               --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG"               Nuvio-Prefetch-4K-arm64-v8a.apk               APK-SHA256.txt               apk-signature.txt               apk-badging.txt               --target "$GITHUB_SHA"               --title 'Nuvio Prefetch 4K Test'               --notes "$NOTES"               --prerelease
          fi
