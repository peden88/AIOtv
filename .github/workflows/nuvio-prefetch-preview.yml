name: Nuvio Prefetch Preview Build

on:
  push:
    branches: [feature/nuvio-next-episode-prefetch]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvio-prefetch-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prefetch-preview-build:
    name: Test prefetch and build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Test prefetch and build preview APK
        run: |
          ./gradlew \
            :app:testFullDebugUnitTest \
            --tests 'com.nuvio.tv.updater.*' \
            --tests 'com.nuvio.tv.data.repository.StreamSearchSessionCacheTest' \
            --tests 'com.nuvio.tv.ui.screens.player.NextEpisodeStreamPrefetchPolicyTest' \
            :app:assembleFullDebug \
            --stacktrace

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-prefetch-preview-${{ github.run_number }}
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          SOURCE_APK='app/build/outputs/apk/full/debug/app-full-universal-debug.apk'
          RELEASE_APK='Nuvio-prefetch-preview.apk'
          TAG='nuvio-prefetch-preview'

          test -f "$SOURCE_APK"
          cp "$SOURCE_APK" "$RELEASE_APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" \
              "$RELEASE_APK" \
              --target "$HEAD_SHA" \
              --title 'Nuvio Prefetch Preview' \
              --notes 'Side-by-side Nuvio debug build containing only next-episode stream-discovery prefetch.' \
              --prerelease
          fi
