name: AIOtv Control Test

on:
  pull_request:
    branches: [dev]
    paths:
      - "control-server/**"
      - ".github/workflows/aiotv-control-test.yml"
  push:
    branches: [feature/aiotv-control-mvp]
    paths:
      - "control-server/**"
      - ".github/workflows/aiotv-control-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aiotv-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control-server/package-lock.json

      - name: Test control service
        working-directory: control-server
        run: npm ci && npm test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish test image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: control-server
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aiotv-control:test
