name: AIOtv Managed Debug Build

on:
  push:
    branches: [dev]
    paths:
      - 'app/**'
      - '.github/workflows/aiotv-managed-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aiotv-managed-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build managed AIOtv APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare CI signing config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          keystore_path="$RUNNER_TEMP/aiotv-managed.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            key_alias="${RELEASE_KEY_ALIAS:-nuviotv}"
            key_password="${RELEASE_KEY_PASSWORD:-815787}"
            store_password="${RELEASE_STORE_PASSWORD:-815787}"
          else
            keytool -genkeypair \
              -v \
              -keystore "$keystore_path" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=AIOtv Managed Debug,O=AIOtv,C=GB" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            key_alias="androiddebugkey"
            key_password="android"
            store_password="android"
            echo "Using a generated test signing key; configure the NUVIO_RELEASE_* secrets for in-place upgrades."
          fi

          {
            echo "NUVIO_RELEASE_STORE_FILE=$keystore_path"
            echo "NUVIO_RELEASE_KEY_ALIAS=$key_alias"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$key_password"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$store_password"
          } >> "$GITHUB_ENV"

      - name: Build managed AIOtv APK
        run: ./gradlew :app:assembleManagedDebug --stacktrace

      - name: Upload managed APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: aiotv-managed-debug-${{ github.run_number }}
          path: app/build/outputs/apk/managed/debug/app-managed-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent Downloader APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/managed/debug/app-managed-universal-debug.apk AIOtv-test.apk
          gh release upload aiotv-test AIOtv-test.apk --clobber --repo "$GITHUB_REPOSITORY"
