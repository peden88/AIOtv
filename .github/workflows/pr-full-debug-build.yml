name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, feature/aio-device-auth]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi

          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          else
            touch local.dev.properties
          fi

      - name: Prepare stable AIOtv test signing config
        run: |
          base64 --decode .github/test-signing/aiotv-test.jks.b64 > "$RUNNER_TEMP/aiotv-test.jks"

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/aiotv-test.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=aiotvtest"
            echo "NUVIO_RELEASE_KEY_PASSWORD=aiotvtest"
            echo "NUVIO_RELEASE_STORE_PASSWORD=aiotvtest"
          } >> "$GITHUB_ENV"

      - name: Apply AIOtv product and UI layers
        run: |
          python3 scripts/apply-aiotv-polish.py
          python3 scripts/apply-aiotv-ui-refresh.py
          python3 scripts/apply-aiotv-shell.py
          python3 scripts/apply-aiotv-surfaces.py
          python3 scripts/apply-aiotv-player.py

      - name: Test updater and build fullDebug APK
        run: ./gradlew :app:testFullDebugUnitTest --tests 'com.nuvio.tv.updater.*' :app:assembleFullDebug --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: aiotv-ui-full-debug-pr-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest AIOtv UI test APK
        if: github.repository == 'peden88/AIOtv' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SOURCE_APK='app/build/outputs/apk/full/debug/app-full-universal-debug.apk'
          RELEASE_APK='AIOtv-ui-test.apk'
          TAG='aiotv-ui-test'

          cp "$SOURCE_APK" "$RELEASE_APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber
          else
            gh release create "$TAG" \
              "$RELEASE_APK" \
              --target "$HEAD_SHA" \
              --title 'AIOtv UI Test Build' \
              --notes 'Isolated AIOtv UI redesign prototype. This does not replace the known-good AIOtv test release.' \
              --prerelease
          fi
