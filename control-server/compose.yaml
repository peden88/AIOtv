services:
  aiotv-control:
    build:
      context: .
    container_name: aiotv-control
    restart: unless-stopped
    environment:
      AIOTV_PUBLIC_URL: ${AIOTV_PUBLIC_URL:?Set AIOTV_PUBLIC_URL}
      AIOTV_ADMIN_PASSWORD: ${AIOTV_ADMIN_PASSWORD:?Set AIOTV_ADMIN_PASSWORD}
      AIOTV_SESSION_SECRET: ${AIOTV_SESSION_SECRET:?Set AIOTV_SESSION_SECRET}
      AIOTV_DATABASE_PATH: /app/data/aiotv-control.sqlite
      AIOTV_PORT: 3000
      AIOTV_COOKIE_SECURE: ${AIOTV_COOKIE_SECURE:-true}
      AIOTV_ALLOW_HTTP_ADDONS: ${AIOTV_ALLOW_HTTP_ADDONS:-false}
      AIOTV_METADATA_ALLOWED_HOSTS: ${AIOTV_METADATA_ALLOWED_HOSTS:-}
      AIOTV_METADATA_PROXY_TIMEOUT_MS: ${AIOTV_METADATA_PROXY_TIMEOUT_MS:-15000}
      AIOTV_PREFETCH_EVENT_RETENTION_DAYS: ${AIOTV_PREFETCH_EVENT_RETENTION_DAYS:-14}
      AIOTV_PREFETCH_EVENT_MAX_ROWS: ${AIOTV_PREFETCH_EVENT_MAX_ROWS:-5000}
    volumes:
      - aiotv-control-data:/app/data
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - default
      - pangolin
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  pangolin:
    external: true
    name: pangolin_frontend

volumes:
  aiotv-control-data:
